name: A Team Bot

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may start runs a few minutes late)
  workflow_dispatch:          # lets you press "Run workflow" by hand

permissions:
  contents: write             # so the bot can save ateam_state.json

concurrency:
  group: ateam-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Install hidden browser (for Parexel)
        run: python -m playwright install --with-deps chromium

      - name: Check sites and post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_FOOTER: ${{ vars.POST_FOOTER }}
        run: python ateam_bot.py

      - name: Save what the bot has seen
        run: |
          git config user.name "A Team Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ateam_state.json
          git diff --cached --quiet || (git commit -m "Update seen studies" && git pull --rebase && git push)
