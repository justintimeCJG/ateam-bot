name: A Team Bot

on:
  schedule:
    # every 10 minutes, about 6am-7pm Central (times below are UTC; the bot
    # itself skips anything outside 6am-7pm Central)
    - cron: "4-59/10 0,11-23 * * *"
  workflow_dispatch:          # lets you press "Run workflow" by hand
    inputs:
      test_posts:
        description: "Test: post this many sample studies (one per site) instead of a normal check. 0 = normal run"
        default: "0"
      sources:
        description: "Test: only these sources, comma-separated keys (blank = all)"
        default: ""

permissions:
  contents: write             # so the bot can save what it has already posted

concurrency:
  group: ateam-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: America/Chicago
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TEST_POSTS: ${{ github.event.inputs.test_posts || '0' }}
      TEST_SOURCES: ${{ github.event.inputs.sources || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Install hidden browser
        run: python -m playwright install --with-deps chromium

      - name: Check sites and post to Telegram
        if: env.TEST_POSTS == '0'
        run: python studybot.py --once

      - name: Post sample studies (test)
        if: env.TEST_POSTS != '0'
        run: |
          python - <<'PY'
          import asyncio, os, re, time
          import studybot as sb
          from playwright.async_api import async_playwright
          picks = ["icon_sa", "icon_lenexa", "icon_slc", "icon_sa_screenings",
                   "parexel_bal", "parexel_la", "fortrea", "abbvie", "celerion",
                   "trialmed", "alta_kc", "alta_la", "medpace", "drvince", "frontage"]
          only = [k.strip() for k in os.environ.get("TEST_SOURCES", "").split(",") if k.strip()]
          if only:
              picks = only
          n = int(os.environ["TEST_POSTS"])
          async def main():
              async with async_playwright() as p:
                  ctx = await (await p.chromium.launch()).new_context()
                  sent = 0
                  for key in picks:
                      if sent >= n:
                          break
                      key, _, want = key.partition(":")   # e.g. fortrea:Madison = a Madison study
                      src = next(s for s in sb.SOURCES if s["key"] == key)
                      cur = await sb.read_source(ctx, src)
                      items = [v for v in cur.values() if want.lower() in (v.get("text") or "").lower()]
                      items.sort(key=lambda v: not re.search(r"[A-Z][a-z]{2} \d{1,2} \d{4}", v.get("text") or ""))
                      if not items:
                          print(key, want, "no studies listed")
                          continue
                      item = items[0]
                      await sb.fill_details(ctx, src, item)
                      msg = sb.build_post(src, "New", item)
                      print("----- " + key + " " + want + "\n" + msg)
                      ok = sb.send(msg)
                      print(key, "posted" if ok else "FAILED")
                      sent += ok
                      time.sleep(3)
          asyncio.run(main())
          PY

      - name: Save what the bot has seen
        if: always() && env.TEST_POSTS == '0'
        run: |
          git config user.name "A Team Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studybot.db config.json
          git diff --cached --quiet || (git commit -m "Update seen studies" && git pull --rebase && git push)
