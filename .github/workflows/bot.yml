name: A Team Bot

on:
  schedule:
    # every 10 minutes, about 6am-7pm Central (times below are UTC; the bot
    # itself skips anything outside 6am-7pm Central)
    - cron: "4-59/10 0,11-23 * * *"
  workflow_dispatch:          # lets you press "Run workflow" by hand

permissions:
  contents: write             # so the bot can save what it has already posted

concurrency:
  group: ateam-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Install hidden browser
        run: python -m playwright install --with-deps chromium

      - name: Check sites and post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python studybot.py --once

      - name: Save what the bot has seen
        if: always()
        run: |
          git config user.name "A Team Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studybot.db config.json
          git diff --cached --quiet || (git commit -m "Update seen studies" && git pull --rebase && git push)
